<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>킬로그 자동 추출기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:#0b1220;
  color:#eef3ff;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
}
.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:18px;
}
.card{
  background:linear-gradient(180deg,#13233f,#0e1a31);
  border:1px solid rgba(116,158,255,.25);
  border-radius:22px;
  padding:18px;
  box-shadow:0 12px 40px rgba(0,0,0,.25);
}
h1{
  margin:0 0 10px;
  font-size:28px;
  font-weight:900;
}
.sub{
  opacity:.82;
  font-size:14px;
  margin-bottom:16px;
}
.top-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:16px;
}
button,label.btn{
  border:none;
  border-radius:14px;
  padding:13px 16px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}
.btn-main{
  background:#7faaff;
  color:#08101d;
}
.btn-dark{
  background:#192842;
  color:#eef3ff;
  border:1px solid rgba(255,255,255,.08);
}
.btn-red{
  background:#5c2330;
  color:#fff;
  border:1px solid rgba(255,130,130,.28);
}
#fileInput{display:none}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:14px;
}
.item{
  background:#0e1730;
  border:1px solid rgba(122,162,255,.18);
  border-radius:18px;
  padding:14px;
}
.item h3{
  margin:0 0 10px;
  font-size:15px;
  word-break:break-all;
}
.preview-row{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
.panel{
  background:#091122;
  border-radius:14px;
  padding:10px;
  border:1px solid rgba(255,255,255,.06);
}
.panel-title{
  font-size:12px;
  opacity:.8;
  margin-bottom:8px;
}
img.preview{
  width:100%;
  display:block;
  border-radius:10px;
  background:#000;
}
.result-box{
  min-height:140px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:
    linear-gradient(45deg,#0b1326 25%,#0d1730 25%,#0d1730 50%,#0b1326 50%,#0b1326 75%,#0d1730 75%,#0d1730 100%);
  background-size:20px 20px;
  overflow:hidden;
}
.item-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}
.status{
  margin-top:10px;
  font-size:13px;
  opacity:.9;
}
.good{color:#8df0b2}
.warn{color:#ffd57c}
.bad{color:#ff9b9b}
.footer{
  margin-top:18px;
  opacity:.68;
  font-size:12px;
}
.counter{
  font-weight:800;
  color:#9cc0ff;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>킬로그 자동 추출기</h1>
    <div class="sub">원본 스크린샷을 넣으면 서버가 킬로그를 자동 추출합니다.</div>

    <div class="top-actions">
      <label class="btn btn-main" for="fileInput">사진 추가</label>
      <button class="btn-dark" id="processAllBtn">전체 추출</button>
      <button class="btn-dark" id="downloadAllBtn">전체 저장</button>
      <button class="btn-red" id="clearBtn">전체 삭제</button>
      <div style="display:flex;align-items:center;padding:0 4px;font-size:14px;">
        사진 <span id="fileCount" class="counter" style="margin-left:6px;">0</span>장
      </div>
    </div>

    <input id="fileInput" type="file" accept="image/*" multiple />

    <div id="list" class="grid"></div>

    <div class="footer">
      서버 주소는 코드 안에 고정되어 있습니다. 링크 입력칸은 없습니다.
    </div>
  </div>
</div>

<script>
/* 여기만 네 서버 주소로 바꾸면 됨 */
const API_BASE = "https://YOUR-RENDER-APP.onrender.com";

const fileInput = document.getElementById("fileInput");
const listEl = document.getElementById("list");
const fileCountEl = document.getElementById("fileCount");
const processAllBtn = document.getElementById("processAllBtn");
const downloadAllBtn = document.getElementById("downloadAllBtn");
const clearBtn = document.getElementById("clearBtn");

const items = [];

function updateCount(){
  fileCountEl.textContent = items.length;
}

function setStatus(item, text, cls=""){
  item.statusEl.className = "status " + cls;
  item.statusEl.textContent = text;
}

function createItem(file){
  const id = crypto.randomUUID();
  const objectUrl = URL.createObjectURL(file);

  const wrap = document.createElement("div");
  wrap.className = "item";

  wrap.innerHTML = `
    <h3>${file.name}</h3>
    <div class="preview-row">
      <div class="panel">
        <div class="panel-title">원본</div>
        <img class="preview" src="${objectUrl}" alt="원본 미리보기">
      </div>
      <div class="panel">
        <div class="panel-title">추출 결과</div>
        <div class="result-box"><span style="opacity:.55;font-size:13px;">아직 결과 없음</span></div>
      </div>
    </div>
    <div class="item-actions">
      <button class="btn-main process-btn">추출</button>
      <button class="btn-dark download-btn" disabled>저장</button>
      <button class="btn-dark share-btn" disabled>공유</button>
      <button class="btn-red remove-btn">삭제</button>
    </div>
    <div class="status">대기중</div>
  `;

  listEl.appendChild(wrap);

  const item = {
    id,
    file,
    objectUrl,
    el: wrap,
    resultBlob: null,
    resultUrl: null,
    resultBox: wrap.querySelector(".result-box"),
    processBtn: wrap.querySelector(".process-btn"),
    downloadBtn: wrap.querySelector(".download-btn"),
    shareBtn: wrap.querySelector(".share-btn"),
    removeBtn: wrap.querySelector(".remove-btn"),
    statusEl: wrap.querySelector(".status"),
  };

  item.processBtn.onclick = () => processOne(item);
  item.downloadBtn.onclick = () => downloadOne(item);
  item.shareBtn.onclick = () => shareOne(item);
  item.removeBtn.onclick = () => removeOne(item);

  items.push(item);
  updateCount();
}

function removeOne(item){
  if(item.objectUrl) URL.revokeObjectURL(item.objectUrl);
  if(item.resultUrl) URL.revokeObjectURL(item.resultUrl);
  item.el.remove();
  const idx = items.findIndex(v => v.id === item.id);
  if(idx >= 0) items.splice(idx,1);
  updateCount();
}

fileInput.addEventListener("change", e => {
  const files = [...e.target.files || []];
  files.forEach(createItem);
  fileInput.value = "";
});

async function processOne(item){
  try{
    setStatus(item, "추출 중...", "warn");
    item.processBtn.disabled = true;

    const fd = new FormData();
    fd.append("file", item.file);

    const res = await fetch(`${API_BASE}/extract-killlog`, {
      method: "POST",
      body: fd
    });

    if(!res.ok){
      throw new Error(`서버 오류 ${res.status}`);
    }

    const blob = await res.blob();

    if(item.resultUrl) URL.revokeObjectURL(item.resultUrl);
    item.resultBlob = blob;
    item.resultUrl = URL.createObjectURL(blob);

    item.resultBox.innerHTML = "";
    const img = document.createElement("img");
    img.src = item.resultUrl;
    img.className = "preview";
    img.alt = "결과";
    item.resultBox.appendChild(img);

    item.downloadBtn.disabled = false;
    item.shareBtn.disabled = false;
    setStatus(item, "추출 완료", "good");
  }catch(err){
    console.error(err);
    setStatus(item, "추출 실패", "bad");
  }finally{
    item.processBtn.disabled = false;
  }
}

async function processAll(){
  for(const item of items){
    await processOne(item);
  }
}

function downloadOne(item){
  if(!item.resultBlob) return;
  const a = document.createElement("a");
  a.href = item.resultUrl;
  a.download = item.file.name.replace(/\.[^.]+$/, "") + "_killlog.png";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function shareOne(item){
  if(!item.resultBlob) return;

  try{
    const file = new File(
      [item.resultBlob],
      item.file.name.replace(/\.[^.]+$/, "") + "_killlog.png",
      { type: "image/png" }
    );

    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({
        files:[file],
        title:"킬로그 결과"
      });
    }else{
      downloadOne(item);
    }
  }catch(err){
    console.log(err);
  }
}

function downloadAll(){
  items.forEach(item => {
    if(item.resultBlob) downloadOne(item);
  });
}

clearBtn.onclick = () => {
  [...items].forEach(removeOne);
};

processAllBtn.onclick = processAll;
downloadAllBtn.onclick = downloadAll;
</script>
</body>
</html>
