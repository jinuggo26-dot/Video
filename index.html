<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>킬로그 자동 추출 연결 테스트</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1426;color:#eaf2ff;font:15px system-ui,'Noto Sans KR',sans-serif}main{max-width:1080px;margin:0 auto;padding:20px}h1{font-size:24px}button,.pick{display:inline-block;cursor:pointer;border:0;border-radius:12px;background:#86b0ff;color:#0a1322;padding:12px 16px;font-weight:800;font:inherit;margin:4px}button:disabled{opacity:.45;cursor:default}.secondary{background:#283c5e;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{padding:14px;border-radius:16px;border:1px solid #384f76;background:#162440;min-width:0}.card img{display:block;max-width:100%;max-height:180px;object-fit:contain;margin:8px auto}.result{display:flex;min-height:130px;align-items:center;justify-content:center;background:repeating-conic-gradient(#1f324a 0% 25%,#41526a 0% 50%) 50%/18px 18px;border-radius:10px}.note{color:#b6c9e8}#status{white-space:pre-wrap}header{margin-bottom:16px}
</style></head><body><main><header><h1>킬로그 자동 추출 · 연결 확인</h1><p class="note">사진을 선택하면 서버로 전송해 투명 PNG로 변환합니다. 별도 서버 주소 입력은 필요 없습니다.</p><label class="pick">원본 사진 추가<input id="file" type="file" accept="image/*" multiple hidden></label><button id="all" class="secondary">전체 추출</button><button id="clear" class="secondary">전체 삭제</button><p id="status" class="note">서버 확인 중…</p></header><section id="list" class="grid"></section></main><script>
'use strict';
const API_BASE=location.hostname.endsWith('.onrender.com')?location.origin:'https://jerry-wbjm.onrender.com';
const $=id=>document.getElementById(id),items=[];
async function serverHealth(){try{let r=await fetch(API_BASE+'/health'); if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();$('status').textContent=d.engine==='killlog-auto-no-grabcut'?'서버 연결됨 · 자동 추출 준비 완료':'현재 서버는 이전 버전입니다. Render에서 app.py를 먼저 교체하세요. (현재: '+(d.engine||'알 수 없음')+')'}catch(e){$('status').textContent='서버 연결 확인 실패: '+e.message;}}serverHealth();
function add(file){let el=document.createElement('article');el.className='card';let h=document.createElement('h3');h.textContent=file.name;let src=URL.createObjectURL(file),img=document.createElement('img');img.src=src;img.alt='원본';let result=document.createElement('div');result.className='result';result.textContent='변환 전';let status=document.createElement('p');status.className='note';status.textContent='대기 중';let process=document.createElement('button');process.textContent='추출';let save=document.createElement('button');save.className='secondary';save.textContent='PNG 저장';save.disabled=true;let del=document.createElement('button');del.className='secondary';del.textContent='삭제';el.append(h,img,result,status,process,save,del);$('list').append(el);let it={file,el,src,process,save,status,result,url:null,blob:null,removed:false};items.push(it);process.onclick=()=>extract(it);save.onclick=()=>{if(!it.url)return;let a=document.createElement('a');a.href=it.url;a.download=file.name.replace(/\.[^.]+$/,'')+'_killlog.png';a.click()};del.onclick=()=>{it.removed=true;URL.revokeObjectURL(it.src);if(it.url)URL.revokeObjectURL(it.url);it.el.remove();items.splice(items.indexOf(it),1)};}
async function extract(it){if(it.removed)return;it.process.disabled=true;it.status.textContent='추출 중…';try{let fd=new FormData();fd.append('file',it.file,it.file.name);let r=await fetch(API_BASE+'/extract-killlog',{method:'POST',body:fd});if(!r.ok){let message='';try{let data=await r.json();message=data.detail||JSON.stringify(data)}catch(e){}throw Error('HTTP '+r.status+(message?' · '+message:''));}let blob=await r.blob();if(!blob.type.includes('png'))throw Error('서버가 PNG 대신 '+blob.type+'을 반환했습니다.');if(it.removed)return;if(it.url)URL.revokeObjectURL(it.url);it.url=URL.createObjectURL(blob);it.blob=blob;it.result.replaceChildren();let image=document.createElement('img');image.alt='PNG 추출 결과';image.src=it.url;it.result.append(image);it.save.disabled=false;it.status.textContent='추출 완료';}catch(e){let msg=e.message||String(e);if(msg.includes('Failed to fetch')||msg.includes('NetworkError'))msg='서버 통신 실패(주소·CORS·배포 상태 확인)';it.status.textContent='추출 실패: '+msg;}finally{it.process.disabled=false;}}
$('file').onchange=e=>{[...(e.target.files||[])].forEach(add);e.target.value=''};$('all').onclick=async()=>{for(let it of [...items])await extract(it)};$('clear').onclick=()=>{for(let it of [...items]){it.removed=true;URL.revokeObjectURL(it.src);if(it.url)URL.revokeObjectURL(it.url);it.el.remove()}items.length=0};
</script></body></html>
