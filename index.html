<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>킬로그 자동 추출</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#081425;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
body{min-height:100vh}
main{max-width:1120px;margin:auto;padding:20px 14px 80px}
h1{margin:0 0 10px;font-size:clamp(22px,4.6vw,30px)}
p{margin:8px 0;line-height:1.55}
.sub{color:#b7c9ea;font-size:14px}
.toolbar,.actions,.edit-top,.edit-actions,.edit-tools{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.toolbar{margin:15px 0 12px}
button,.pick,select,input[type=range]{font:inherit}
button,.pick{border:0;background:#263a61;color:#fff;min-height:44px;border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
button.primary,.pick{background:#8db0ff;color:#081423}
button.danger{background:#482737;color:#ffd1d6}
button.ghost{background:#182741;border:1px solid #365179;color:#dfeaff}
button:disabled{opacity:.45;cursor:default}
select{background:#12213b;color:#fff;border:1px solid #3f5e8f;min-height:42px;border-radius:10px;padding:0 10px}
input[type=range]{width:140px}
label.inline{display:inline-flex;align-items:center;gap:8px;color:#d7e4fb;font-size:14px;font-weight:700}
#file{display:none}
#status{white-space:pre-wrap;color:#c4d7fb;margin-top:10px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;margin-top:16px}
.item{background:#11203a;border:1px solid #304a74;border-radius:18px;padding:13px;min-width:0}
.item h3{font-size:14px;margin:0 0 8px;word-break:break-all}
.thumb{width:100%;height:110px;object-fit:contain;background:#0a1527;border:1px solid #243b60;border-radius:10px}
.result-box{height:154px;margin-top:10px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#2d3b52 0% 25%,#42536d 0% 50%) 50% / 20px 20px;border:1px solid #314866;color:#dce8fb}
.result-box img{display:block;width:100%;height:100%;object-fit:contain}
.item-status{font-size:13px;color:#b5caea;margin:9px 0 2px}
.tip{font-size:12px;color:#91a8cc;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(3,9,17,.84);display:none;align-items:center;justify-content:center;padding:16px;z-index:9999}
.modal.show{display:flex}
.modal-card{width:min(980px,100%);max-height:90vh;background:#0f1b31;border:1px solid #35517b;border-radius:18px;padding:14px;overflow:auto}
.modal-card h2{margin:0 0 10px;font-size:20px}
.edit-wrap{background:repeating-conic-gradient(#2d3b52 0% 25%,#42536d 0% 50%) 50% / 20px 20px;border:1px solid #324a73;border-radius:14px;padding:10px;overflow:auto;touch-action:none}
#editCanvas{display:block;max-width:100%;height:auto;margin:auto;background:transparent;touch-action:none}
.edit-tools{margin:12px 0}
.badge{padding:9px 11px;border-radius:10px;background:#162742;border:1px solid #314b76;color:#dce8fb;font-size:13px;font-weight:700}
.small{font-size:12px;color:#abc0e3}
hr.sep{border:0;border-top:1px solid #29415f;margin:14px 0}
</style>
</head>
<body>
<main>
  <h1>킬로그 자동 추출</h1>
  <p class="sub">기본 추출 + 배경 정리 + 장식 보호를 합친 통합 방식입니다. 추출 후 보정에서 살릴 부분은 칠해서 보호하고, 지울 부분은 배경만 지울 수 있습니다.</p>
  <div class="toolbar">
    <label for="file" class="pick">원본 사진 추가</label>
    <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/*" multiple>
    <button id="all" class="primary">전체 추출</button>
    <button id="saveAll" class="ghost">모두 저장 / 공유</button>
    <button id="clear" class="danger">전체 삭제</button>
  </div>
  <p id="status">서버 확인 중…</p>
  <section id="list"></section>
</main>

<div id="editorModal" class="modal">
  <div class="modal-card">
    <div class="edit-top" style="justify-content:space-between">
      <h2>킬로그 보정</h2>
      <button id="closeEditor" class="ghost">닫기</button>
    </div>
    <p class="sub">살리기 붓은 장식이나 킬로그 부분을 보호합니다. 배경 지우기 붓은 지우고 싶은 배경 부분에 칠한 뒤 적용하면, 보호한 부분을 제외하고 배경만 지웁니다.</p>
    <div class="edit-tools">
      <button id="modeKeep" class="primary">살리기 붓</button>
      <button id="modeBg" class="ghost">배경 지우기 붓</button>
      <label class="inline">붓 크기 <input id="brushSize" type="range" min="6" max="70" value="22"></label>
      <span id="brushLabel" class="badge">22px</span>
      <label class="inline">배경 허용치 <input id="tolerance" type="range" min="8" max="90" value="34"></label>
      <span id="tolLabel" class="badge">34</span>
    </div>
    <div class="edit-wrap">
      <canvas id="editCanvas" width="760" height="190"></canvas>
    </div>
    <p class="small">같은 색이 킬로그 안에 있어도, 직접 배경으로 칠한 부분만 지우도록 만들어져 있습니다.</p>
    <hr class="sep">
    <div class="edit-actions">
      <button id="applyBg" class="ghost">배경 지우기 적용</button>
      <button id="clearPaint" class="ghost">칠한 표시만 지우기</button>
      <button id="resetEdit" class="ghost">처음 추출본으로 되돌리기</button>
      <button id="saveEdit" class="primary">보정 저장</button>
    </div>
  </div>
</div>

<script>
'use strict';

const DEFAULT_API_BASE = 'https://video-fsp5.onrender.com';
const API_BASE = (location.hostname.endsWith('.onrender.com') ? location.origin : DEFAULT_API_BASE).replace(/\/+$/, '');
const $ = id => document.getElementById(id);
const items = [];
let counter = 0;
let processingAll = false;

function serverMessage(message){
  $('status').textContent = message;
}

function friendlyError(error){
  const s = String(error?.message || error || '');
  if(/Failed to fetch|NetworkError|Load failed/i.test(s)) return '서버에 연결할 수 없습니다. Render 주소와 배포 상태를 확인하세요.';
  return s;
}

async function checkServer(){
  try{
    const r = await fetch(API_BASE + '/health', { cache:'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    serverMessage(d.ok ? '서버 연결됨 · 통합 추출 사용 가능' : '서버 응답을 확인해 주세요.');
  }catch(error){
    serverMessage('서버 연결 실패: ' + friendlyError(error));
  }
}
checkServer();

function createButton(text, cls){
  const b = document.createElement('button');
  b.textContent = text;
  b.className = cls || '';
  return b;
}

function filename(item){
  return item.file.name.replace(/\.[^.]+$/, '').slice(0,100) + '_killlog.png';
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function canShareFiles(files){
  try{
    return !!(navigator.canShare && navigator.share && navigator.canShare({ files }));
  }catch(e){
    return false;
  }
}

async function shareOne(item){
  if(!item.blob) return;
  const file = new File([item.blob], filename(item), { type:'image/png' });
  if(canShareFiles([file])){
    try{
      await navigator.share({ files:[file] });
      return;
    }catch(error){
      if(error?.name === 'AbortError') return;
    }
  }
  downloadBlob(item.blob, filename(item));
}

function crc32(data){
  let crc = 0xffffffff;
  for(let i=0;i<data.length;i++){
    crc ^= data[i];
    for(let k=0;k<8;k++) crc = (crc & 1) ? ((crc >>> 1) ^ 0xedb88320) : (crc >>> 1);
  }
  return (crc ^ 0xffffffff) >>> 0;
}

function writeU16(view, at, value){ view.setUint16(at, value, true); }
function writeU32(view, at, value){ view.setUint32(at, value >>> 0, true); }

async function createZip(ready){
  const encoder = new TextEncoder();
  const entries = [];
  let offset = 0;

  for(const item of ready){
    const name = encoder.encode(filename(item));
    const data = new Uint8Array(await item.blob.arrayBuffer());
    const crc = crc32(data);

    const lh = new Uint8Array(30 + name.length);
    const h = new DataView(lh.buffer);
    writeU32(h,0,0x04034b50);
    writeU16(h,4,20);
    writeU16(h,6,0x0800);
    writeU16(h,8,0);
    writeU32(h,14,crc);
    writeU32(h,18,data.length);
    writeU32(h,22,data.length);
    writeU16(h,26,name.length);
    lh.set(name,30);

    entries.push({ name, data, crc, lh, offset });
    offset += lh.length + data.length;
  }

  const locals = [];
  const centrals = [];

  for(const e of entries){
    locals.push(e.lh, e.data);

    const cd = new Uint8Array(46 + e.name.length);
    const v = new DataView(cd.buffer);
    writeU32(v,0,0x02014b50);
    writeU16(v,4,20);
    writeU16(v,6,20);
    writeU16(v,8,0x0800);
    writeU16(v,10,0);
    writeU32(v,16,e.crc);
    writeU32(v,20,e.data.length);
    writeU32(v,24,e.data.length);
    writeU16(v,28,e.name.length);
    writeU32(v,42,e.offset);
    cd.set(e.name,46);

    centrals.push(cd);
  }

  const centralSize = centrals.reduce((s,p) => s + p.length, 0);
  const end = new Uint8Array(22);
  const view = new DataView(end.buffer);
  writeU32(view,0,0x06054b50);
  writeU16(view,8,entries.length);
  writeU16(view,10,entries.length);
  writeU32(view,12,centralSize);
  writeU32(view,16,offset);

  return new Blob([...locals, ...centrals, end], { type:'application/zip' });
}

function addFile(file){
  const root = document.createElement('article');
  root.className = 'item';

  const title = document.createElement('h3');
  title.textContent = file.name;

  const thumb = document.createElement('img');
  thumb.className = 'thumb';
  thumb.alt = '원본';
  const sourceUrl = URL.createObjectURL(file);
  thumb.src = sourceUrl;

  const result = document.createElement('div');
  result.className = 'result-box';
  result.textContent = '추출 전';

  const status = document.createElement('p');
  status.className = 'item-status';
  status.textContent = '대기 중';

  const actions = document.createElement('div');
  actions.className = 'actions';

  const run = createButton('추출', 'primary');
  const edit = createButton('보정', 'ghost');
  edit.disabled = true;
  const save = createButton('PNG 저장 / 공유', 'ghost');
  save.disabled = true;
  const remove = createButton('삭제', 'danger');

  const tip = document.createElement('p');
  tip.className = 'tip';
  tip.textContent = '보정에서 살릴 부분은 칠해서 보호하고, 배경 지우기 적용으로 배경만 지울 수 있습니다.';

  actions.append(run, edit, save, remove);
  root.append(title, thumb, result, status, actions, tip);
  $('list').append(root);

  const item = {
    id: ++counter,
    file,
    sourceUrl,
    root,
    result,
    status,
    run,
    edit,
    save,
    remove,
    blob:null,
    originalBlob:null,
    resultUrl:null,
    removed:false
  };

  items.push(item);

  run.onclick = () => processOne(item);
  edit.onclick = () => openEditor(item);
  save.onclick = () => shareOne(item);
  remove.onclick = () => removeOne(item);
}

function removeOne(item){
  item.removed = true;
  URL.revokeObjectURL(item.sourceUrl);
  if(item.resultUrl) URL.revokeObjectURL(item.resultUrl);
  item.root.remove();
  const idx = items.indexOf(item);
  if(idx >= 0) items.splice(idx, 1);
}

$('file').addEventListener('change', e => {
  for(const file of e.target.files || []) addFile(file);
  e.target.value = '';
});

async function processOne(item){
  if(item.removed) return;
  item.run.disabled = true;
  item.status.textContent = '추출 중…';

  try{
    const form = new FormData();
    form.append('file', item.file, item.file.name);

    const response = await fetch(API_BASE + '/extract-killlog', {
      method:'POST',
      body:form
    });

    if(!response.ok){
      let details = '';
      try{
        const data = await response.json();
        details = data.detail || '';
      }catch(e){}
      throw new Error('HTTP ' + response.status + (details ? ' · ' + details : ''));
    }

    const blob = await response.blob();
    if(!blob.type.includes('png')) throw new Error('PNG가 아닌 응답이 반환됐습니다.');

    if(item.removed) return;
    if(item.resultUrl) URL.revokeObjectURL(item.resultUrl);

    item.originalBlob = blob;
    item.blob = blob;
    item.resultUrl = URL.createObjectURL(blob);

    const pic = document.createElement('img');
    pic.src = item.resultUrl;
    pic.alt = '추출 결과';
    item.result.replaceChildren(pic);

    item.edit.disabled = false;
    item.save.disabled = false;
    item.status.textContent = '추출 완료';
  }catch(error){
    item.status.textContent = '추출 실패: ' + friendlyError(error);
  }finally{
    item.run.disabled = false;
  }
}

$('all').onclick = async() => {
  if(processingAll) return;
  processingAll = true;
  $('all').disabled = true;
  try{
    for(const item of [...items]){
      if(!item.removed) await processOne(item);
    }
  }finally{
    processingAll = false;
    $('all').disabled = false;
  }
};

$('clear').onclick = () => {
  for(const item of [...items]) removeOne(item);
  serverMessage('목록이 비워졌습니다.');
};

$('saveAll').onclick = async() => {
  const ready = items.filter(item => item.blob && !item.removed);
  if(!ready.length){
    serverMessage('먼저 사진을 추출해 주세요.');
    return;
  }

  const files = ready.map(item => new File([item.blob], filename(item), { type:'image/png' }));
  if(canShareFiles(files)){
    try{
      await navigator.share({ files });
      return;
    }catch(error){
      if(error?.name === 'AbortError') return;
    }
  }

  $('saveAll').disabled = true;
  serverMessage('여러 장 공유를 지원하지 않아 ZIP 파일로 저장합니다.');

  try{
    const zip = await createZip(ready);
    downloadBlob(zip, 'killlog_' + ready.length + 'photos.zip');
  }catch(error){
    serverMessage('ZIP 저장 실패: ' + friendlyError(error));
  }finally{
    $('saveAll').disabled = false;
  }
};

function loadBlobAsImage(blob){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('이미지를 불러오지 못했습니다.'));
    };
    img.src = url;
  });
}

const editor = {
  open:false,
  item:null,
  mode:'keep',
  drawing:false,
  lastX:0,
  lastY:0,
  view:$('editCanvas'),
  current:document.createElement('canvas'),
  original:document.createElement('canvas'),
  keep:document.createElement('canvas'),
  seeds:document.createElement('canvas')
};

editor.vctx = editor.view.getContext('2d');
editor.currentCtx = editor.current.getContext('2d', { willReadFrequently:true });
editor.originalCtx = editor.original.getContext('2d', { willReadFrequently:true });
editor.keepCtx = editor.keep.getContext('2d');
editor.seedCtx = editor.seeds.getContext('2d');

function setMode(mode){
  editor.mode = mode;
  $('modeKeep').className = mode === 'keep' ? 'primary' : 'ghost';
  $('modeBg').className = mode === 'bg' ? 'primary' : 'ghost';
}

$('modeKeep').onclick = () => setMode('keep');
$('modeBg').onclick = () => setMode('bg');

$('brushSize').oninput = () => {
  $('brushLabel').textContent = $('brushSize').value + 'px';
};

$('tolerance').oninput = () => {
  $('tolLabel').textContent = $('tolerance').value;
};

function clearCanvas(canvas, ctx){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function redrawEditor(){
  const w = editor.current.width;
  const h = editor.current.height;

  editor.vctx.clearRect(0, 0, w, h);
  editor.vctx.drawImage(editor.current, 0, 0);

  const keepData = editor.keepCtx.getImageData(0,0,w,h).data;
  const seedData = editor.seedCtx.getImageData(0,0,w,h).data;
  const overlay = editor.vctx.createImageData(w, h);
  const out = overlay.data;

  for(let i=0;i<keepData.length;i+=4){
    if(keepData[i+3] > 0){
      out[i] = 40;
      out[i+1] = 220;
      out[i+2] = 120;
      out[i+3] = 95;
    }else if(seedData[i+3] > 0){
      out[i] = 255;
      out[i+1] = 80;
      out[i+2] = 80;
      out[i+3] = 95;
    }
  }

  editor.vctx.putImageData(overlay, 0, 0);
}

function getCanvasPos(e){
  const rect = editor.view.getBoundingClientRect();
  const scaleX = editor.view.width / rect.width;
  const scaleY = editor.view.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x:(clientX - rect.left) * scaleX,
    y:(clientY - rect.top) * scaleY
  };
}

function drawCircle(ctx, x, y, radius){
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
}

function restoreFromOriginal(x, y, radius){
  editor.currentCtx.save();
  editor.currentCtx.beginPath();
  editor.currentCtx.arc(x, y, radius, 0, Math.PI * 2);
  editor.currentCtx.clip();
  editor.currentCtx.drawImage(editor.original, 0, 0);
  editor.currentCtx.restore();
}

function paintAt(x, y){
  const radius = Number($('brushSize').value) / 2;

  if(editor.mode === 'keep'){
    editor.keepCtx.fillStyle = '#ffffff';
    drawCircle(editor.keepCtx, x, y, radius);
    restoreFromOriginal(x, y, radius);
  }else{
    editor.seedCtx.fillStyle = '#ffffff';
    drawCircle(editor.seedCtx, x, y, radius);
  }

  redrawEditor();
}

function paintLine(x1, y1, x2, y2){
  const dx = x2 - x1;
  const dy = y2 - y1;
  const dist = Math.max(1, Math.hypot(dx, dy));
  const step = Math.max(1, Number($('brushSize').value) / 5);

  for(let t=0;t<=dist;t+=step){
    const x = x1 + dx * (t / dist);
    const y = y1 + dy * (t / dist);
    paintAt(x, y);
  }
  paintAt(x2, y2);
}

function startDraw(e){
  if(!editor.open) return;
  e.preventDefault();
  editor.drawing = true;
  const pos = getCanvasPos(e);
  editor.lastX = pos.x;
  editor.lastY = pos.y;
  paintAt(pos.x, pos.y);
}

function moveDraw(e){
  if(!editor.open || !editor.drawing) return;
  e.preventDefault();
  const pos = getCanvasPos(e);
  paintLine(editor.lastX, editor.lastY, pos.x, pos.y);
  editor.lastX = pos.x;
  editor.lastY = pos.y;
}

function endDraw(){
  editor.drawing = false;
}

['pointerdown','mousedown','touchstart'].forEach(evt => {
  editor.view.addEventListener(evt, startDraw, { passive:false });
});
['pointermove','mousemove','touchmove'].forEach(evt => {
  editor.view.addEventListener(evt, moveDraw, { passive:false });
});
['pointerup','pointerleave','mouseup','mouseleave','touchend','touchcancel'].forEach(evt => {
  editor.view.addEventListener(evt, endDraw, { passive:false });
});

async function openEditor(item){
  if(!item.blob) return;

  editor.item = item;
  const img = await loadBlobAsImage(item.blob);
  const w = img.naturalWidth || img.width;
  const h = img.naturalHeight || img.height;

  [editor.view, editor.current, editor.original, editor.keep, editor.seeds].forEach(c => {
    c.width = w;
    c.height = h;
  });

  clearCanvas(editor.original, editor.originalCtx);
  clearCanvas(editor.current, editor.currentCtx);
  clearCanvas(editor.keep, editor.keepCtx);
  clearCanvas(editor.seeds, editor.seedCtx);

  editor.originalCtx.drawImage(img, 0, 0, w, h);
  editor.currentCtx.drawImage(img, 0, 0, w, h);

  setMode('keep');
  redrawEditor();
  editor.open = true;
  $('editorModal').classList.add('show');
}

function closeEditor(){
  editor.open = false;
  editor.item = null;
  $('editorModal').classList.remove('show');
}

$('closeEditor').onclick = closeEditor;

function floodEraseBySeeds(){
  const w = editor.current.width;
  const h = editor.current.height;
  if(!w || !h) return;

  const img = editor.currentCtx.getImageData(0, 0, w, h);
  const data = img.data;
  const keep = editor.keepCtx.getImageData(0, 0, w, h).data;
  const seed = editor.seedCtx.getImageData(0, 0, w, h).data;
  const tolerance = Number($('tolerance').value);

  const seeds = [];
  for(let y=0;y<h;y+=2){
    for(let x=0;x<w;x+=2){
      const p = (y * w + x) * 4;
      if(seed[p+3] > 0 && keep[p+3] === 0 && data[p+3] > 0){
        seeds.push([x, y]);
      }
    }
  }

  if(!seeds.length){
    redrawEditor();
    return;
  }

  function inRange(x, y){
    return x >= 0 && y >= 0 && x < w && y < h;
  }

  function colorOk(idx, sr, sg, sb){
    if(keep[idx + 3] > 0) return false;
    if(data[idx + 3] < 8) return false;
    const dr = data[idx] - sr;
    const dg = data[idx + 1] - sg;
    const db = data[idx + 2] - sb;
    return Math.abs(dr) <= tolerance && Math.abs(dg) <= tolerance && Math.abs(db) <= tolerance;
  }

  for(const [sx, sy] of seeds){
    const start = (sy * w + sx) * 4;
    if(keep[start + 3] > 0 || data[start + 3] < 8) continue;

    const sr = data[start];
    const sg = data[start + 1];
    const sb = data[start + 2];

    const localVisited = new Uint8Array(w * h);
    const stack = [[sx, sy]];

    while(stack.length){
      const [x, y] = stack.pop();
      const pos = y * w + x;
      if(localVisited[pos]) continue;
      localVisited[pos] = 1;

      const idx = pos * 4;
      if(!colorOk(idx, sr, sg, sb)) continue;

      data[idx + 3] = 0;

      if(inRange(x+1, y)) stack.push([x+1, y]);
      if(inRange(x-1, y)) stack.push([x-1, y]);
      if(inRange(x, y+1)) stack.push([x, y+1]);
      if(inRange(x, y-1)) stack.push([x, y-1]);
    }
  }

  editor.currentCtx.putImageData(img, 0, 0);
  clearCanvas(editor.seeds, editor.seedCtx);
  redrawEditor();
}

$('applyBg').onclick = floodEraseBySeeds;

$('clearPaint').onclick = () => {
  clearCanvas(editor.keep, editor.keepCtx);
  clearCanvas(editor.seeds, editor.seedCtx);
  redrawEditor();
};

$('resetEdit').onclick = () => {
  if(!editor.open) return;
  clearCanvas(editor.current, editor.currentCtx);
  editor.currentCtx.drawImage(editor.original, 0, 0);
  clearCanvas(editor.keep, editor.keepCtx);
  clearCanvas(editor.seeds, editor.seedCtx);
  redrawEditor();
};

$('saveEdit').onclick = async() => {
  if(!editor.item) return;

  const blob = await new Promise(resolve => editor.current.toBlob(resolve, 'image/png'));
  if(!blob) return;

  const item = editor.item;
  item.blob = blob;

  if(item.resultUrl) URL.revokeObjectURL(item.resultUrl);
  item.resultUrl = URL.createObjectURL(blob);

  const pic = document.createElement('img');
  pic.src = item.resultUrl;
  pic.alt = '보정 결과';
  item.result.replaceChildren(pic);
  item.status.textContent = '보정 저장 완료';

  closeEditor();
};

$('editorModal').addEventListener('click', e => {
  if(e.target === $('editorModal')) closeEditor();
});
</script>
</body>
</html>
