<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1426">
<title>킬로그 자동 추출기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark}
body{margin:0;background:#0b1426;color:#edf3ff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",system-ui,sans-serif;font-size:15px}
main{max-width:1120px;margin:auto;padding:20px 14px 80px}
header{padding:8px 0 18px}
h1{font-size:clamp(21px,4.5vw,29px);margin:0 0 12px}
p{margin:8px 0 12px;line-height:1.55}
.sub{color:#aec2df;font-size:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:16px 0}
button,.pick{border:1px solid #384b6e;background:#243655;color:#fff;min-height:44px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:11px 14px;font:inherit;font-weight:750;white-space:nowrap}
button.primary,.pick{background:#8eafff;color:#09152a;border:0}
button.danger{background:#35223a;border-color:#714458;color:#ffccd0}
button:disabled{opacity:.45;cursor:default}
.mode-box{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:12px 0 14px}
.mode-box label{font-weight:750;font-size:14px;color:#ccd9ee}
select{background:#192a46;color:white;border:1px solid #587099;border-radius:10px;font:inherit;padding:11px 12px;min-height:44px;max-width:100%}
#status{color:#b9d3ff;margin-top:10px;white-space:pre-wrap}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px;margin-top:16px}
.item{border:1px solid #324b76;border-radius:18px;padding:13px;background:#152541;min-width:0}
.item h3{word-break:break-all;margin:0 0 9px;font-size:14px;font-weight:700}
.orig{width:100%;height:110px;object-fit:contain;background:#0b1729;border:1px solid #2a3f61;border-radius:10px}
.result{height:150px;background:repeating-conic-gradient(#28364c 0% 25%,#3c4c65 0% 50%) 50% / 20px 20px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-top:10px;color:#c9d8ea;overflow:hidden}
.result img{object-fit:contain;display:block;width:100%;max-height:150px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions button{min-height:40px;padding:10px 12px;font-size:13px}
.item-status{font-size:13px;color:#b2c9e9;margin:9px 0 2px}
.tip{color:#95a9c5;font-size:12px;margin:8px 0}
#file{display:none}

/* 정밀 보정 모달 */
.modal{position:fixed;inset:0;background:rgba(3,9,17,.85);display:none;align-items:center;justify-content:center;padding:12px;z-index:9999}
.modal.show{display:flex}
.modal-card{width:min(980px,100%);max-height:94dvh;overflow:auto;background:#101c32;border:1px solid #36527b;border-radius:18px;padding:15px}
.modal-top,.edit-tools,.edit-actions{display:flex;align-items:center;flex-wrap:wrap;gap:9px}
.modal-top{justify-content:space-between}
.modal h2{font-size:19px;margin:0}
.modal .badge{background:#162943;border:1px solid #3e5a83;border-radius:8px;padding:8px;color:#c7dbfa}
.modal .sub{margin:10px 0}
.edit-wrap{background:repeating-conic-gradient(#233450 0% 25%,#3b4f6d 0% 50%) 50%/20px 20px;border:1px solid #37537b;border-radius:14px;padding:10px;margin:13px 0;overflow:hidden}
#editCanvas{display:block;max-width:100%;height:auto;margin:auto;background:transparent;touch-action:none}
.edit-tools{margin:12px 0}
.edit-tools label{display:flex;gap:8px;align-items:center;font-size:14px;color:#bcd0eb}
.edit-tools input[type=range]{width:120px;accent-color:#8eafff}
.edit-actions{margin:13px 0 0}
.edit-actions button{min-height:40px}
.actions button{font-size:13px;min-height:40px;padding:9px 11px}
</style>
</head>
<body>
<main>
<header>
<h1>킬로그 자동 추출</h1>
<p class="sub">킬로그 추출 · 보정 · PNG 저장</p>
<div class="toolbar">
<label for="file" class="pick">사진 추가</label>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/*" multiple>
<button id="all" class="primary">전체 추출</button>
<button id="saveAll">모두 저장 / 공유</button>
<button id="clear" class="danger">전체 삭제</button>
</div>
<p id="status">서버 확인 중…</p>
</header>
<section id="list"></section>
</main>

<div id="editorModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
 <div class="modal-card">
  <div class="modal-top"><h2 id="editTitle">킬로그 보정</h2><button id="closeEditor">닫기</button></div>
  <p class="sub">살리기: 원본 색 복원 · 배경 지우기: 칠하면 바로 지워짐 · 킬로그 본체 보호</p>
  <div class="edit-tools">
   <button id="modeKeep" class="primary">살리기</button>
   <button id="modeBg">배경 지우기</button>
   <label>붓 크기 <input id="brushSize" type="range" min="4" max="70" value="22"></label>
   <span class="badge" id="brushLabel">22px</span>
   <label>배경 색상 허용치 <input id="tolerance" type="range" min="5" max="90" value="30"></label>
   <span class="badge" id="tolLabel">30</span>
  </div>
  <div class="edit-wrap"><canvas id="editCanvas" width="760" height="190"></canvas></div>
  <div id="editFeedback" role="status" aria-live="polite" class="sub" style="min-height:20px;margin:8px 0"></div>
  <div class="edit-actions">
   <button id="applyBg" disabled>배경 지우기는 바로 적용됨</button>
   <button id="clearPaint">칠한 표시 지우기</button>
   <button id="resetEdit">원래대로</button>
   <button id="saveEdit" class="primary">보정 저장</button>
  </div>
 </div>
</div>

<script>
'use strict';
const API_BASE=(location.hostname.endsWith('.onrender.com')?location.origin:'https://video-fsp5.onrender.com').replace(/\/+$/,'');
const $=id=>document.getElementById(id);
const items=[];
let counter=0;
let processingAll=false;
function serverMessage(message){$('status').textContent=message;}
async function checkServer(){
 try{
  const r=await fetch(API_BASE+'/health',{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();
  serverMessage(d.ok && (d.endpoint||'').includes('/extract-killlog') ? '서버 연결됨 · 추출 및 보정 사용 가능' : '서버 응답을 확인해 주세요.');
 }catch(error){serverMessage('서버 연결 실패: '+(error.message||error));}
}
checkServer();
function createButton(text,cls){const b=document.createElement('button');b.textContent=text;b.className=cls||'';return b;}
function addFile(file){
 const root=document.createElement('article');root.className='item';
 const title=document.createElement('h3');title.textContent=file.name;
 const img=document.createElement('img');img.className='orig';img.alt='원본';
 const sourceUrl=URL.createObjectURL(file);img.src=sourceUrl;
 const result=document.createElement('div');result.className='result';result.textContent='추출 전';
 const status=document.createElement('p');status.className='item-status';status.textContent='대기 중';
 const actions=document.createElement('div');actions.className='actions';
 const run=createButton('추출','primary');
 const edit=createButton('보정');edit.disabled=true;
 const save=createButton('PNG 저장 / 공유');save.disabled=true;
 const remove=createButton('삭제','danger');
 actions.append(run,edit,save,remove);root.append(title,img,result,status,actions);
 $('list').append(root);
 const item={id:++counter,file,sourceUrl,root,result,status,run,save,blob:null,resultUrl:null,removed:false};
 item.edit=edit;item.originalBlob=null;
 items.push(item);
 run.onclick=()=>processOne(item);
 edit.onclick=()=>openEditor(item);
 save.onclick=()=>shareOne(item);
 remove.onclick=()=>removeOne(item);
}
function removeOne(it){
 it.removed=true;
 URL.revokeObjectURL(it.sourceUrl);
 if(it.resultUrl)URL.revokeObjectURL(it.resultUrl);
 it.root.remove();
 const idx=items.indexOf(it);if(idx>=0)items.splice(idx,1);
}
$('file').onchange=e=>{for(const file of e.target.files||[])addFile(file);e.target.value='';};
function friendlyError(error){
 const s=String(error?.message||error);
 if(/Failed to fetch|NetworkError|Load failed/i.test(s))return '서버에 연결할 수 없습니다. Render 주소와 배포 상태를 확인하세요.';
 return s;
}
async function processOne(it){
 if(it.removed)return;
 it.run.disabled=true;it.status.textContent='추출 중…';
 try{
  const form=new FormData();form.append('file',it.file,it.file.name);
  const response=await fetch(API_BASE+'/extract-killlog',{method:'POST',body:form});
  if(!response.ok){let details='';try{const data=await response.json();details=data.detail||'';}catch(e){}
   throw new Error('HTTP '+response.status+(details?' · '+details:''));}
  const blob=await response.blob();
  if(!blob.type.includes('png'))throw new Error('PNG가 아닌 응답이 반환됐습니다.');
  if(it.removed)return;
  if(it.resultUrl)URL.revokeObjectURL(it.resultUrl);
  it.blob=blob;it.originalBlob=blob;it.referenceBlob=null;it.referencePromise=null;it.resultUrl=URL.createObjectURL(blob);
  const pic=document.createElement('img');pic.src=it.resultUrl;pic.alt='추출된 투명 PNG';
  it.result.replaceChildren(pic);it.save.disabled=false;it.edit.disabled=false;
  it.status.textContent='추출 완료';
 }catch(error){it.status.textContent='추출 실패: '+friendlyError(error);}
 finally{it.run.disabled=false;}
}
$('all').onclick=async()=>{
 if(processingAll)return;
 processingAll=true;$('all').disabled=true;
 try{for(const it of [...items]){if(!it.removed)await processOne(it);}}
 finally{processingAll=false;$('all').disabled=false;}
};
$('clear').onclick=()=>{for(const it of [...items])removeOne(it);serverMessage('목록이 비워졌습니다.');};
function filename(it){return it.file.name.replace(/\.[^.]+$/,'').slice(0,100)+'_killlog.png';}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function canShareFiles(files){try{return !!(navigator.canShare&&navigator.share&&navigator.canShare({files}));}catch(e){return false;}}
async function shareOne(it){
 if(!it.blob)return;
 const file=new File([it.blob],filename(it),{type:'image/png'});
 if(canShareFiles([file])){
  try{await navigator.share({files:[file]});return;}
  catch(error){if(error?.name==='AbortError')return;}
 }
 downloadBlob(it.blob,filename(it));
}
function crc32(data){
 let crc=0xffffffff;
 for(let i=0;i<data.length;i++){
  crc^=data[i];
  for(let k=0;k<8;k++)crc=(crc&1)?((crc>>>1)^0xedb88320):(crc>>>1);
 }
 return(crc^0xffffffff)>>>0;
}
function writeU16(view,at,value){view.setUint16(at,value,true)}
function writeU32(view,at,value){view.setUint32(at,value>>>0,true)}
async function createZip(ready){
 const encoder=new TextEncoder();
 const entries=[];let offset=0;
 for(const it of ready){
  const name=encoder.encode(filename(it));
  const data=new Uint8Array(await it.blob.arrayBuffer());
  const crc=crc32(data);
  const lh=new Uint8Array(30+name.length);
  const h=new DataView(lh.buffer);
  writeU32(h,0,0x04034b50);writeU16(h,4,20);writeU16(h,6,0x0800);writeU16(h,8,0);
  writeU32(h,14,crc);writeU32(h,18,data.length);writeU32(h,22,data.length);writeU16(h,26,name.length);
  lh.set(name,30);
  entries.push({name,data,crc,lh,offset});
  offset+=lh.length+data.length;
 }
 const locals=[];const centrals=[];
 for(const e of entries){
  locals.push(e.lh,e.data);
  const cd=new Uint8Array(46+e.name.length);const v=new DataView(cd.buffer);
  writeU32(v,0,0x02014b50);writeU16(v,4,20);writeU16(v,6,20);writeU16(v,8,0x0800);
  writeU16(v,10,0);writeU32(v,16,e.crc);writeU32(v,20,e.data.length);
  writeU32(v,24,e.data.length);writeU16(v,28,e.name.length);writeU32(v,42,e.offset);cd.set(e.name,46);
  centrals.push(cd);
 }
 const centralSize=centrals.reduce((s,p)=>s+p.length,0);
 const end=new Uint8Array(22);const view=new DataView(end.buffer);
 writeU32(view,0,0x06054b50);writeU16(view,8,entries.length);writeU16(view,10,entries.length);
 writeU32(view,12,centralSize);writeU32(view,16,offset);
 return new Blob([...locals,...centrals,end],{type:'application/zip'});
}
$('saveAll').onclick=async()=>{
 const ready=items.filter(it=>it.blob&&!it.removed);
 if(!ready.length){serverMessage('먼저 사진을 추출해 주세요.');return;}
 const files=ready.map(it=>new File([it.blob],filename(it),{type:'image/png'}));
 if(canShareFiles(files)){
  try{await navigator.share({files});return;}
  catch(error){if(error?.name==='AbortError')return;}
 }
 // Browser/native share targets cannot be forced to include KakaoTalk or Gallery.
 // ZIP fallback guarantees a *single* download, not dozens of separate downloads.
 $('saveAll').disabled=true;serverMessage('여러 장 공유를 지원하지 않아 ZIP 파일로 저장합니다.');
 try{const zip=await createZip(ready);downloadBlob(zip,'killlog_'+ready.length+'photos.zip');}
 catch(error){serverMessage('ZIP 저장 실패: '+friendlyError(error));}
 finally{$('saveAll').disabled=false;}
};

/* ===== 킬로그 보정: 살리기는 즉시 복원, 배경 지우기는 즉시 삭제 ===== */
const E={
 open:false, item:null, mode:'keep', drawing:false,
 view:$('editCanvas'), src:document.createElement('canvas'), current:document.createElement('canvas'),
 keep:document.createElement('canvas'), overlay:document.createElement('canvas'), reference:document.createElement('canvas'),
 last:null, protect:null, protectBox:null, erasedPixels:0
};
E.ctx=E.view.getContext('2d',{willReadFrequently:true});
E.srcCtx=E.src.getContext('2d',{willReadFrequently:true});
E.curCtx=E.current.getContext('2d',{willReadFrequently:true});
E.keepCtx=E.keep.getContext('2d',{willReadFrequently:true});
E.overlayCtx=E.overlay.getContext('2d',{willReadFrequently:true});
E.refCtx=E.reference.getContext('2d',{willReadFrequently:true});

function setEditMode(mode){
 E.mode=mode;
 $('modeKeep').className=mode==='keep'?'primary':'';
 $('modeBg').className=mode==='bg'?'primary':'';
 const note=$('editFeedback');
 if(note){
  note.textContent=mode==='bg'
   ? '배경 지우기는 칠하는 즉시 적용됩니다. 킬로그 본체는 보호되고, 겉에 붙은 잔여 배경/장식은 바로 지울 수 있습니다.'
   : '살리기는 칠하는 즉시 원본 색으로 복원됩니다.';
 }
}
$('modeKeep').onclick=()=>setEditMode('keep');
$('modeBg').onclick=()=>setEditMode('bg');
$('brushSize').oninput=()=>{$('brushLabel').textContent=$('brushSize').value+'px';};
$('tolerance').oninput=()=>{$('tolLabel').textContent=$('tolerance').value;};

function redrawEditor(){
 if(!E.open) return;
 const w=E.view.width,h=E.view.height;
 E.ctx.clearRect(0,0,w,h);
 E.ctx.drawImage(E.current,0,0);
 const a=E.keepCtx.getImageData(0,0,w,h).data;
 const layer=E.overlayCtx.createImageData(w,h);
 const d=layer.data;
 for(let i=0;i<d.length;i+=4){
  if(a[i+3]>0){d[i]=30;d[i+1]=242;d[i+2]=126;d[i+3]=100;}
 }
 E.overlayCtx.putImageData(layer,0,0);
 E.ctx.drawImage(E.overlay,0,0);
}
function canvasPos(e){
 const rect=E.view.getBoundingClientRect();
 return {x:(e.clientX-rect.left)*E.view.width/rect.width,
         y:(e.clientY-rect.top)*E.view.height/rect.height};
}
function circle(ctx,x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}

function buildProtectedCore(){
 const w=E.src.width,h=E.src.height;
 const data=E.srcCtx.getImageData(0,0,w,h).data;
 const occ=new Int32Array(h);
 let maxOcc=0;
 for(let y=0;y<h;y++){
  let c=0;
  for(let x=0;x<w;x++) if(data[(y*w+x)*4+3]>28) c++;
  occ[y]=c; if(c>maxOcc) maxOcc=c;
 }
 const thr=Math.max(54,Math.round(maxOcc*0.42));
 let bestStart=0,bestEnd=Math.max(0,h-1),bestLen=-1;
 let cur=-1;
 for(let y=0;y<h;y++){
  if(occ[y]>=thr){ if(cur<0) cur=y; }
  else if(cur>=0){ const len=y-cur; if(len>bestLen){bestLen=len; bestStart=cur; bestEnd=y-1;} cur=-1; }
 }
 if(cur>=0){ const len=h-cur; if(len>bestLen){bestLen=len; bestStart=cur; bestEnd=h-1;} }
 if(bestLen<0){ bestStart=Math.round(h*0.34); bestEnd=Math.round(h*0.66); }
 let left=w,right=0,found=0;
 const tY=Math.max(0,bestStart-3), bY=Math.min(h-1,bestEnd+3);
 for(let y=tY;y<=bY;y++){
  for(let x=0;x<w;x++){
   if(data[(y*w+x)*4+3]>28){ found++; if(x<left)left=x; if(x>right)right=x; }
  }
 }
 if(!found){ left=Math.round(w*0.14); right=Math.round(w*0.86); }
 left=Math.max(0,left-18); right=Math.min(w-1,right+18);
 const top=Math.max(0,bestStart-10), bottom=Math.min(h-1,bestEnd+10);
 const mask=new Uint8Array(w*h);
 for(let y=top;y<=bottom;y++){
  for(let x=left;x<=right;x++){
   const idx=y*w+x, p=idx*4;
   if(data[p+3]>8) mask[idx]=1;
  }
 }
 const out=new Uint8Array(w*h);
 for(let y=0;y<h;y++) for(let x=0;x<w;x++){
  let v=0;
  for(let dy=-2;dy<=2 && !v;dy++){
   const yy=y+dy; if(yy<0||yy>=h) continue;
   for(let dx=-2;dx<=2;dx++){
    const xx=x+dx; if(xx<0||xx>=w) continue;
    if(mask[yy*w+xx]){ v=1; break; }
   }
  }
  out[y*w+x]=v;
 }
 E.protect=out;
 E.protectBox={left,right,top,bottom};
}

function paintDot(x,y){
 const r=Number($('brushSize').value)/2;
 if(E.mode==='keep'){
  E.keepCtx.fillStyle='white';circle(E.keepCtx,x,y,r);
  E.curCtx.save();E.curCtx.beginPath();E.curCtx.arc(x,y,r,0,Math.PI*2);
  E.curCtx.clip();E.curCtx.drawImage(E.reference,0,0);E.curCtx.restore();
  redrawEditor();
  const note=$('editFeedback'); if(note) note.textContent='원본 색을 바로 복원했습니다.';
  if(E.item) E.item.status.textContent='원본 색 복원 중';
  return;
 }
 eraseBrush(x,y,r);
}

function eraseBrush(x,y,r){
 if(!E.open) return;
 const w=E.current.width,h=E.current.height;
 const picture=E.curCtx.getImageData(0,0,w,h), data=picture.data;
 const keep=E.keepCtx.getImageData(0,0,w,h).data;
 const tolerance=Number($('tolerance').value);
 let erased=0, touched=0;
 const minX=Math.max(0,Math.floor(x-r-1)), maxX=Math.min(w-1,Math.ceil(x+r+1));
 const minY=Math.max(0,Math.floor(y-r-1)), maxY=Math.min(h-1,Math.ceil(y+r+1));
 for(let yy=minY;yy<=maxY;yy++){
  for(let xx=minX;xx<=maxX;xx++){
   const dx=xx-x, dy=yy-y;
   if(dx*dx+dy*dy>r*r) continue;
   const idx=yy*w+xx, p=idx*4;
   if(data[p+3]===0) continue;
   touched++;
   if(keep[p+3]!==0) continue;
   if(E.protect && E.protect[idx]) continue;
   const r0=data[p],g0=data[p+1],b0=data[p+2];
   const hi=Math.max(r0,g0,b0), lo=Math.min(r0,g0,b0);
   const chroma=hi-lo;
   const softDark = hi <= Math.max(105, 118 + tolerance) && chroma <= Math.max(42, 34 + tolerance);
   const semiJunk = data[p+3] <= Math.max(220, 150 + tolerance);
   const edgeJunk = yy < (E.protectBox?.top ?? 0) - 2 || yy > (E.protectBox?.bottom ?? h-1) + 2 || xx < (E.protectBox?.left ?? 0) - 4 || xx > (E.protectBox?.right ?? w-1) + 4;
   if(!(softDark || semiJunk || edgeJunk)) continue;
   data[p+3]=0;
   erased++;
  }
 }
 if(erased>0){
  E.curCtx.putImageData(picture,0,0);
  E.erasedPixels += erased;
  redrawEditor();
 }
 const note=$('editFeedback');
 if(note){
  note.textContent = erased>0
   ? '배경/겉장식 '+erased.toLocaleString()+'픽셀을 바로 지웠습니다.'
   : touched>0
      ? '이 부분은 킬로그 본체 보호 영역이거나 이미 지워진 부분입니다.'
      : '지울 부분을 칠해 주세요.';
 }
 if(E.item) E.item.status.textContent = erased>0 ? '배경 정리 중' : '보정 중';
}

function paintStroke(from,to){
 const d=Math.hypot(to.x-from.x,to.y-from.y);
 const step=Math.max(1,Number($('brushSize').value)/5);
 for(let s=0;s<=d;s+=step){const t=d===0?0:s/d;paintDot(from.x+(to.x-from.x)*t,from.y+(to.y-from.y)*t);} 
 paintDot(to.x,to.y);
}
E.view.addEventListener('pointerdown',e=>{
 if(!E.open)return;e.preventDefault();E.drawing=true;
 try{E.view.setPointerCapture(e.pointerId);}catch(err){}
 E.last=canvasPos(e);paintDot(E.last.x,E.last.y);
});
E.view.addEventListener('pointermove',e=>{
 if(!E.open||!E.drawing)return;e.preventDefault();
 const pt=canvasPos(e);paintStroke(E.last,pt);E.last=pt;
});
for(const evt of ['pointerup','pointercancel','lostpointercapture']){
 E.view.addEventListener(evt,()=>{E.drawing=false;E.last=null;});
}
function imageFromBlob(blob){
 return new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(blob),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(url);resolve(im);};
  im.onerror=()=>{URL.revokeObjectURL(url);reject(Error('이미지를 읽지 못했습니다.'));};
  im.src=url;
 });
}
async function fetchSourceReference(item){
 if(item.referenceBlob) return item.referenceBlob;
 if(item.referencePromise) return item.referencePromise;
 item.referencePromise=(async()=>{
  const form=new FormData();
  form.append('file',item.file,item.file.name);
  const r=await fetch(API_BASE+'/extract-killlog-reference',{method:'POST',body:form});
  if(!r.ok) {
   let detail='';try{detail=(await r.json()).detail||'';}catch(e){}
   if(r.status===404)throw Error('Render의 app.py를 최신 버전으로 교체해 주세요.');
   throw Error('원본 색 불러오기 실패 HTTP '+r.status+(detail?' · '+detail:''));
  }
  const blob=await r.blob();
  if(!blob.type.includes('png')) throw Error('복원용 원본 이미지가 PNG가 아닙니다.');
  item.referenceBlob=blob;
  return blob;
 })();
 try{return await item.referencePromise;}
 finally{item.referencePromise=null;}
}
async function openEditor(item){
 if(!item.blob)return;
 if(item.editorOpening)return;
 item.editorOpening=true;
 item.edit.disabled=true;
 item.status.textContent='원본 색 불러오는 중…';
 try{
  const [img, ref] = await Promise.all([
    imageFromBlob(item.blob),
    fetchSourceReference(item).then(imageFromBlob)
  ]);
  if(item.removed)return;
  if(img.naturalWidth!==ref.naturalWidth||img.naturalHeight!==ref.naturalHeight){
    throw Error('원본 복원 이미지의 규격이 일치하지 않습니다.');
  }
  E.open=true;E.item=item;E.drawing=false;E.last=null;E.erasedPixels=0;
  for(const c of [E.view,E.src,E.current,E.keep,E.overlay,E.reference]){
   c.width=img.naturalWidth;c.height=img.naturalHeight;
  }
  E.srcCtx.clearRect(0,0,E.src.width,E.src.height);
  E.curCtx.clearRect(0,0,E.current.width,E.current.height);
  E.keepCtx.clearRect(0,0,E.keep.width,E.keep.height);
  E.overlayCtx.clearRect(0,0,E.overlay.width,E.overlay.height);
  E.refCtx.clearRect(0,0,E.reference.width,E.reference.height);
  E.srcCtx.drawImage(img,0,0);
  E.curCtx.drawImage(img,0,0);
  E.refCtx.drawImage(ref,0,0);
  buildProtectedCore();
  setEditMode('keep');$('editorModal').classList.add('show');redrawEditor();
  item.status.textContent='보정 중';
 }catch(ex){item.status.textContent='보정 창 오류: '+(ex.message||ex);} 
 finally{item.editorOpening=false;item.edit.disabled=false;}
}
function closeEditor(){E.open=false;E.item=null;E.drawing=false;E.last=null;$('editorModal').classList.remove('show');}
$('closeEditor').onclick=closeEditor;
$('editorModal').addEventListener('click',e=>{if(e.target===$('editorModal'))closeEditor();});
$('applyBg').onclick=()=>{ const note=$('editFeedback'); if(note) note.textContent='배경 지우기는 이제 칠하는 즉시 적용됩니다.'; };
$('clearPaint').onclick=()=>{ if(!E.open)return; E.keepCtx.clearRect(0,0,E.view.width,E.view.height); redrawEditor(); const note=$('editFeedback'); if(note) note.textContent='살리기 표시를 지웠습니다.'; };
$('resetEdit').onclick=()=>{
 if(!E.open)return;const w=E.view.width,h=E.view.height;
 E.curCtx.clearRect(0,0,w,h);E.curCtx.drawImage(E.src,0,0);
 E.keepCtx.clearRect(0,0,w,h);buildProtectedCore();redrawEditor();
 const note=$('editFeedback'); if(note) note.textContent='처음 추출 상태로 되돌렸습니다.';
};
$('saveEdit').onclick=()=>{
 if(!E.open||!E.item)return;
 const item=E.item;
 E.current.toBlob(blob=>{
  if(!blob)return;
  if(item.resultUrl)URL.revokeObjectURL(item.resultUrl);
  item.blob=blob;item.resultUrl=URL.createObjectURL(blob);
  const img=new Image();img.src=item.resultUrl;img.alt='보정 결과';
  item.result.replaceChildren(img);item.status.textContent='보정 저장 완료';
  closeEditor();
 },'image/png');
};
</script>
