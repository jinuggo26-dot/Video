<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>MiniCut 영상 편집기</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#111;
 color:white;
 font-family:Arial,sans-serif;
}

header{
 background:#202020;
 padding:15px;
 text-align:center;
 font-size:22px;
 font-weight:bold;
}

main{
 max-width:1000px;
 margin:auto;
 padding:15px;
}

.preview{
 background:black;
 border-radius:12px;
 overflow:hidden;
 margin-bottom:15px;
}

canvas{
 width:100%;
 display:block;
 background:black;
}

video{
 display:none;
}

.panel{
 background:#222;
 padding:15px;
 margin-bottom:12px;
 border-radius:12px;
}

.panel h3{
 margin-top:0;
}

button,select,input{
 margin:5px 0;
}

button{
 background:#00c896;
 border:0;
 padding:12px;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
}

button:disabled{
 opacity:.5;
}

input[type=range]{
 width:100%;
}

input[type=file]{
 max-width:100%;
}

label{
 display:block;
 margin-top:10px;
}

select{
 padding:8px;
 border-radius:6px;
 background:#333;
 color:white;
}

input[type=text],
input[type=number]{
 padding:8px;
 background:#333;
 color:white;
 border:1px solid #555;
 border-radius:6px;
 max-width:100%;
}

#status{
 color:#00e5aa;
 white-space:pre-wrap;
}

.small{
 color:#aaa;
 font-size:13px;
}
</style>
</head>

<body>

<header>🎬 MiniCut 영상 편집기</header>

<main>

<div class="panel">
<h3>📁 영상 불러오기</h3>

<input
 type="file"
 id="videoInput"
 accept="video/*">

<p id="status">영상을 선택해 주세요.</p>
</div>

<div class="preview">
<canvas id="canvas"></canvas>
</div>

<video
 id="video"
 playsinline
 preload="metadata">
</video>

<div class="panel">
<h3>▶ 재생</h3>

<button id="playBtn">재생 / 일시정지</button>

<p id="timeText">00:00 / 00:00</p>

<input
 type="range"
 id="seek"
 min="0"
 max="100"
 value="0">
</div>

<div class="panel">
<h3>✂️ 영상 자르기</h3>

<label>시작 시간 (초)</label>
<input type="number" id="start" value="0" min="0">

<label>종료 시간 (초)</label>
<input type="number" id="end" value="0" min="0">

<button id="trimBtn">구간 미리보기</button>
</div>

<div class="panel">
<h3>⚡ 속도 조절</h3>

<select id="speed">
<option value="0.25">0.25배</option>
<option value="0.5">0.5배</option>
<option value="1" selected>1배</option>
<option value="1.5">1.5배</option>
<option value="2">2배</option>
<option value="4">4배</option>
</select>
</div>

<div class="panel">
<h3>🎨 색 보정</h3>

<label>밝기</label>
<input type="range" id="brightness"
min="50" max="150" value="100">

<label>대비</label>
<input type="range" id="contrast"
min="50" max="150" value="100">

<label>채도</label>
<input type="range" id="saturation"
min="0" max="200" value="100">

<label>
<input type="checkbox" id="gray">
흑백 효과
</label>

<label>
<input type="checkbox" id="blur">
블러 효과
</label>

<button id="resetBtn">효과 초기화</button>
</div>

<div class="panel">
<h3>🔄 영상 회전</h3>

<button id="rotateBtn">90도 회전</button>
</div>

<div class="panel">
<h3>📝 자막</h3>

<input
 type="text"
 id="caption"
 placeholder="자막을 입력하세요">

<label>자막 크기</label>
<input
 type="range"
 id="fontSize"
 min="16"
 max="80"
 value="36">
</div>

<div class="panel">
<h3>🎵 배경음악</h3>

<input
 type="file"
 id="audioInput"
 accept="audio/*">

<audio id="audio" preload="metadata"></audio>
</div>

<div class="panel">
<h3>💾 영상 저장</h3>

<label>저장 해상도</label>

<select id="resolution">
<option value="1280x720">720p</option>
<option value="1920x1080" selected>1080p</option>
<option value="2560x1440">2K</option>
<option value="3840x2160">4K</option>
<option value="7680x4320">8K (실험적)</option>
<option value="15360x8640">16K (실험적)</option>
</select>

<br>

<button id="exportBtn">영상 저장</button>

<p class="small">
고해상도 저장은 기기 성능에 따라 실패할 수 있습니다.
</p>
</div>

</main>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
 alpha:false
});

const audio = document.getElementById("audio");
const statusText = document.getElementById("status");

let videoURL = null;
let audioURL = null;
let rotation = 0;
let raf = null;
let exporting = false;
let trimPreview = false;

const $ = id => document.getElementById(id);

function status(message){
 statusText.textContent = message;
}

function formatTime(t){
 if(!Number.isFinite(t)) return "00:00";
 const m = Math.floor(t/60);
 const s = Math.floor(t%60);
 return String(m).padStart(2,"0")
 + ":" + String(s).padStart(2,"0");
}

function getRange(){
 const duration = video.duration || 0;

 const start = Math.max(
 0,
 Math.min(Number($("start").value)||0,duration)
 );

 const end = Math.max(
 start,
 Math.min(Number($("end").value)||duration,duration)
 );

 return {start,end};
}

// 영상 불러오기
$("videoInput").addEventListener("change",e=>{
 const file = e.target.files[0];
 if(!file) return;

 stopRender();
 video.pause();
 audio.pause();

 if(videoURL){
  video.removeAttribute("src");
  video.load();
  URL.revokeObjectURL(videoURL);
 }

 videoURL = URL.createObjectURL(file);

 status(
  "영상 정보를 불러오는 중...\n"+
  "파일: "+file.name+"\n"+
  "형식: "+(file.type||"알 수 없음")
 );

 video.src = videoURL;
 video.load();
});

video.addEventListener("loadedmetadata",()=>{
 $("start").value = 0;
 $("end").value = video.duration.toFixed(2);

 const maxPreviewWidth = 960;
 const scale = Math.min(
  1,
  maxPreviewWidth/video.videoWidth
 );

 canvas.width = Math.max(
  1,
  Math.round(video.videoWidth*scale)
 );

 canvas.height = Math.max(
  1,
  Math.round(video.videoHeight*scale)
 );

 $("seek").max = video.duration;

 status("영상 정보 로딩 완료");

 drawFrame();
});

video.addEventListener("loadeddata",()=>{
 drawFrame();
 status("영상 미리보기 준비 완료");
});

// 오류 원인 표시 기능
video.addEventListener("error",()=>{
 const error = video.error;

 if(!error){
  status("영상 오류가 발생했습니다.");
  return;
 }

 switch(error.code){
  case 1:
   status(
    "오류 1: 영상 불러오기가 취소되었습니다."
   );
   break;

  case 2:
   status(
    "오류 2: 영상 데이터를 읽는 중 문제가 발생했습니다."
   );
   break;

  case 3:
   status(
    "오류 3: 영상 디코딩에 실패했습니다.\n"+
    "영상 코덱을 확인해 주세요."
   );
   break;

  case 4:
   status(
    "오류 4: 지원하지 않는 영상 형식 또는 코덱입니다.\n"+
    "MP4(H.264) 영상으로 변환해 보세요."
   );
   break;

  default:
   status("알 수 없는 영상 오류가 발생했습니다.");
 }

 console.error("Video Error:",error);
});

// 화면 그리기
function drawTo(targetCtx,w,h){
 if(video.readyState < 2) return;

 targetCtx.save();

 targetCtx.fillStyle="black";
 targetCtx.fillRect(0,0,w,h);

 const brightness = $("brightness").value;
 const contrast = $("contrast").value;
 const saturation = $("saturation").value;

 let filter =
 `brightness(${brightness}%) `+
 `contrast(${contrast}%) `+
 `saturate(${saturation}%)`;

 if($("gray").checked){
  filter+=" grayscale(100%)";
 }

 if($("blur").checked){
  filter+=" blur(3px)";
 }

 targetCtx.filter=filter;

 targetCtx.translate(w/2,h/2);
 targetCtx.rotate(rotation*Math.PI/180);

 const swapped = rotation%180!==0;
 const availableW = swapped ? h : w;
 const availableH = swapped ? w : h;

 const scale = Math.min(
  availableW/video.videoWidth,
  availableH/video.videoHeight
 );

 const vw = video.videoWidth*scale;
 const vh = video.videoHeight*scale;

 targetCtx.drawImage(
  video,
  -vw/2,
  -vh/2,
  vw,
  vh
 );

 targetCtx.restore();

 // 자막
 const text = $("caption").value;

 if(text){
  targetCtx.save();

  const size =
  Number($("fontSize").value)*w/960;

  targetCtx.font=
  `bold ${Math.max(12,size)}px Arial`;

  targetCtx.textAlign="center";
  targetCtx.fillStyle="white";
  targetCtx.strokeStyle="black";
  targetCtx.lineWidth=4;

  const x=w/2;
  const y=h-40;

  targetCtx.strokeText(text,x,y);
  targetCtx.fillText(text,x,y);

  targetCtx.restore();
 }
}

function drawFrame(){
 drawTo(ctx,canvas.width,canvas.height);
}

function stopRender(){
 if(raf!==null){
  cancelAnimationFrame(raf);
  raf=null;
 }
}

function renderLoop(){
 drawFrame();

 if(!video.paused && !video.ended){
  raf=requestAnimationFrame(renderLoop);
 }else{
  raf=null;
 }
}

video.addEventListener("play",()=>{
 stopRender();
 renderLoop();
});

video.addEventListener("pause",()=>{
 stopRender();
 drawFrame();
});

video.addEventListener("seeked",drawFrame);

video.addEventListener("timeupdate",()=>{
 $("seek").value=video.currentTime;

 $("timeText").textContent=
 formatTime(video.currentTime)
 +" / "+
 formatTime(video.duration);

 if(trimPreview){
  const {end}=getRange();

  if(video.currentTime>=end){
   video.pause();
   trimPreview=false;
  }
 }
});

$("seek").addEventListener("input",()=>{
 video.currentTime=Number($("seek").value);
});

// 재생
$("playBtn").onclick=async()=>{
 if(!videoURL) return;

 if(video.paused){
  await video.play();
  if(audioURL){
   audio.currentTime=0;
   audio.play().catch(()=>{});
  }
 }else{
  video.pause();
  audio.pause();
 }
};

// 구간 미리보기
$("trimBtn").onclick=async()=>{
 const {start,end}=getRange();

 if(end<=start){
  alert("종료 시간을 확인하세요.");
  return;
 }

 trimPreview=true;
 video.currentTime=start;
 await video.play();
};

// 속도
$("speed").onchange=()=>{
 video.playbackRate=Number($("speed").value);
};

// 필터 변경
[
 "brightness",
 "contrast",
 "saturation",
 "gray",
 "blur",
 "caption",
 "fontSize"
].forEach(id=>{
 $(id).addEventListener("input",()=>{
  if(video.paused) drawFrame();
 });
});

// 초기화
$("resetBtn").onclick=()=>{
 $("brightness").value=100;
 $("contrast").value=100;
 $("saturation").value=100;
 $("gray").checked=false;
 $("blur").checked=false;
 drawFrame();
};

// 회전
$("rotateBtn").onclick=()=>{
 rotation=(rotation+90)%360;
 drawFrame();
};

// 음악
$("audioInput").onchange=e=>{
 const file=e.target.files[0];
 if(!file) return;

 if(audioURL){
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  URL.revokeObjectURL(audioURL);
 }

 audioURL=URL.createObjectURL(file);
 audio.src=audioURL;
};

// 저장
$("exportBtn").onclick=async()=>{
 if(exporting) return;

 if(!videoURL){
  alert("영상을 먼저 불러오세요.");
  return;
 }

 if(!canvas.captureStream ||
    !window.MediaRecorder){
  alert("이 브라우저는 영상 저장을 지원하지 않습니다.");
  return;
 }

 const [w,h]=$("resolution").value
 .split("x").map(Number);

 if(w*h>3840*2160){
  const ok=confirm(
   "8K/16K 저장은 아이패드에서 메모리 부족으로 실패할 수 있습니다. 계속할까요?"
  );
  if(!ok) return;
 }

 const {start,end}=getRange();

 if(end<=start){
  alert("저장 구간을 확인하세요.");
  return;
 }

 exporting=true;
 $("exportBtn").disabled=true;

 let exportCanvas;
 let recorder;
 let stream;
 let exportRaf;
 let chunks=[];

 try{
  exportCanvas=document.createElement("canvas");
  exportCanvas.width=w;
  exportCanvas.height=h;

  const exportCtx=exportCanvas.getContext("2d");

  if(!exportCtx){
   throw new Error("저장용 캔버스를 만들 수 없습니다.");
  }

  const mimeTypes=[
   "video/mp4",
   "video/webm;codecs=vp8",
   "video/webm"
  ];

  const mime=mimeTypes.find(type=>
   MediaRecorder.isTypeSupported(type)
  );

  if(!mime){
   throw new Error("지원되는 영상 인코딩 형식이 없습니다.");
  }

  video.pause();
  video.currentTime=start;

  await new Promise(resolve=>{
   if(Math.abs(video.currentTime-start)<0.05){
    resolve();
   }else{
    video.addEventListener("seeked",resolve,{once:true});
   }
  });

  stream=exportCanvas.captureStream(24);

  recorder=new MediaRecorder(stream,{
   mimeType:mime,
   videoBitsPerSecond:8000000
  });

  recorder.ondataavailable=e=>{
   if(e.data.size>0) chunks.push(e.data);
  };

  recorder.onstop=()=>{
   const blob=new Blob(chunks,{type:mime});
   const url=URL.createObjectURL(blob);

   const a=document.createElement("a");
   a.href=url;
   a.download=
   "MiniCut_video."+
   (mime.includes("mp4")?"mp4":"webm");

   a.click();

   setTimeout(()=>URL.revokeObjectURL(url),60000);

   exporting=false;
   $("exportBtn").disabled=false;
   status("영상 저장 완료");
  };

  recorder.onerror=()=>{
   status("영상 저장 중 오류가 발생했습니다.");
  };

  function exportLoop(){
   drawTo(exportCtx,w,h);

   if(video.currentTime>=end ||
      video.ended){
    video.pause();
    if(recorder.state!=="inactive"){
     recorder.stop();
    }
    stream.getTracks().forEach(t=>t.stop());
    return;
   }

   exportRaf=requestAnimationFrame(exportLoop);
  }

  recorder.start(1000);
  await video.play();

  exportLoop();
  status("영상 저장 중...");

 }catch(error){
  status("저장 실패: "+error.message);

  if(exportRaf){
   cancelAnimationFrame(exportRaf);
  }

  if(stream){
   stream.getTracks().forEach(t=>t.stop());
  }

  exporting=false;
  $("exportBtn").disabled=false;
 }
};

window.addEventListener("pagehide",()=>{
 stopRender();

 if(videoURL) URL.revokeObjectURL(videoURL);
 if(audioURL) URL.revokeObjectURL(audioURL);
});
</script>

</body>
</html>
